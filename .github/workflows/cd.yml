name: Container CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build and publish production images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image owner
        id: repo
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.owner }}/talent-cloud-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VITE_API_URL=/api
          tags: ghcr.io/${{ steps.repo.outputs.owner }}/talent-cloud-frontend:latest
