services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatching
      POSTGRES_PASSWORD: jobmatching_dev_password
      POSTGRES_DB: jobmatching
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatching -d jobmatching"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobmatching:jobmatching_dev_password@db:5432/jobmatching
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      TYPHOON_API_KEY: ${TYPHOON_API_KEY:-}
      UPLOAD_DIR: /app/uploads/resumes
      PORT: 5000
      ALLOWED_ORIGINS: http://localhost:8080
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - resume_uploads:/app/uploads/resumes
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  resume_uploads:
